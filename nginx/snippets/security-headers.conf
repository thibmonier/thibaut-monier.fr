# En-têtes de sécurité (security.md §3, ADR-0009). À inclure dans CHAQUE bloc `location` qui ajoute
# un en-tête : un `add_header` dans un `location` annule ceux hérités du `server`.
# Domaines tiers (relevés le 2026-10-15, ADR-0011) : script Umami depuis https://cloud.umami.is (`script-src`),
# mesures envoyées à https://gateway.umami.is (`connect-src`) ; Web3Forms : api.web3forms.com.
add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval' https://cloud.umami.is; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://gateway.umami.is https://api.web3forms.com; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'self' https://api.web3forms.com; frame-ancestors 'none'; object-src 'none'" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# COEP volontairement absent (ADR-0009 : le script Umami n'envoie pas de CORP/CORS).
