# Image nginxinc/nginx-unprivileged : utilisateur non root, port 8080 (ADR-0002, security.md §3).
worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    sendfile on;
    tcp_nopush on;
    server_tokens off;
    gzip on;
    gzip_static on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
    client_max_body_size 1k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    keepalive_timeout 15s;
    limit_conn_zone $binary_remote_addr zone=perip:1m;

    # Journaux sur stdout/stderr (Railway), sans IP ni User-Agent ni Referer.
    log_format minimal '$time_iso8601 "$request_method $uri" $status $body_bytes_sent';
    access_log /dev/stdout minimal;
    error_log /dev/stderr warn;

    # Railway termine le TLS : le protocole d'origine arrive dans X-Forwarded-Proto.
    map $http_x_forwarded_proto $insecure_proto {
        default 0;
        http    1;
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        absolute_redirect off;
        port_in_redirect off;
        limit_conn perip 30;

        if ($insecure_proto) { return 301 https://$host$request_uri; }
        # GET et HEAD seulement
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }

        include /etc/nginx/snippets/security-headers.conf;

        # Dotfiles interdits (.git, .env...), sauf /.well-known/
        location ~ /\.(?!well-known/) { return 404; }
        # Fichiers de source ou de sauvegarde
        location ~* \.(map|bak|old|orig|swp|ts|md|env|yml|yaml|lock)$ { return 404; }

        location / {
            try_files $uri $uri/ =404;
            add_header Cache-Control "no-cache" always;
            include /etc/nginx/snippets/security-headers.conf;
        }

        # Assets hachés par Astro/Vite
        location ^~ /_astro/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            include /etc/nginx/snippets/security-headers.conf;
        }

        # Index Pagefind (sprint 2) : non haché, donc revalidé
        location ^~ /pagefind/ {
            add_header Cache-Control "no-cache" always;
            include /etc/nginx/snippets/security-headers.conf;
        }

        # CV PDF (US-007) : nom stable et contenu régénéré à chaque build, donc revalidé (ETag) au lieu du
        # cache de 30 jours ; exclu de l'indexation (la page Parcours reste la version indexée).
        location = /thibaut-monier-cv.pdf {
            add_header Cache-Control "no-cache" always;
            add_header X-Robots-Tag "noindex" always;
            include /etc/nginx/snippets/security-headers.conf;
        }

        # Images, polices, PDF non hachés
        location ~* \.(png|jpe?g|webp|avif|svg|ico|woff2?|pdf)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000" always;
            include /etc/nginx/snippets/security-headers.conf;
        }

        error_page 404 /404.html;
        location = /404.html {
            internal;
            include /etc/nginx/snippets/security-headers.conf;
        }

        # Page statique générique, sans trace ni version
        error_page 405 500 502 503 504 /50x.html;
        location = /50x.html {
            internal;
            include /etc/nginx/snippets/security-headers.conf;
        }
    }
}
