name: deploy

# Repli manuel (T-001-17) : Railway déploie déjà depuis GitHub (branche `main`, option « Wait for CI »).
# Ce workflow ne sert qu'à pousser à la main le commit courant si ce déploiement est indisponible.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  railway-up:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Jeton Railway requis
        if: ${{ env.RAILWAY_TOKEN == '' }}
        run: |
          echo "::error::Secret RAILWAY_TOKEN non défini."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # CLI Railway en conteneur (ADR-0003) : image de base épinglée par digest, version de la CLI exacte.
      - name: railway up
        run: |
          docker run --rm -e RAILWAY_TOKEN -v "$PWD:/app:ro" -w /app \
            node:26-alpine@sha256:143494b1da2945f061539253adc65e4f1569ddf07da2d384c022c791a9d90a4a \
            npx --yes @railway/cli@5.68.0 up --service web --ci
