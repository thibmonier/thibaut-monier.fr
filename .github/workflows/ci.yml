name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Valeurs factices : exercent le formulaire et le lien de RDV en e2e (Web3Forms simulé par page.route).
env:
  PUBLIC_WEB3FORMS_KEY: 00000000-0000-4000-8000-000000000000
  PUBLIC_CALENDLY_URL: https://calendly.com/exemple/echange-decouverte

# Docker uniquement sur le runner (ADR-0003) : aucun Node installé, cache BuildKit en mode GitHub Actions.
jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Cible `test` : npm ci, build + contrôles, ESLint, Prettier, astro check, Vitest + couverture
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: test
          cache-from: type=gha,scope=test
          cache-to: type=gha,scope=test,mode=max
      # Export de dist/ (cible `dist`) pour Lighthouse et les contrôles de l'étape e2e
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: dist
          outputs: type=local,dest=dist
          cache-from: type=gha,scope=test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e:
    name: e2e
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build de l'image de production (preview)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          load: true
          tags: thibaut-monier-preview
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,scope=runtime,mode=max
      - name: Build de l'image e2e (Playwright)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: e2e
          load: true
          tags: thibaut-monier-e2e
          cache-from: type=gha,scope=e2e
          cache-to: type=gha,scope=e2e,mode=max
      - name: Playwright et axe contre preview
        run: docker compose --profile e2e run --rm e2e
      - name: Lighthouse (médiane de 3, seuil 0,95)
        run: docker compose --profile e2e run --rm e2e node scripts/checks/lighthouse.ts
      - name: Rapports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapports-qualite
          path: reports
          if-no-files-found: ignore
          retention-days: 14

  dockerfile:
    name: dockerfile
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Hadolint
        run: docker run --rm -i hadolint/hadolint@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d < Dockerfile

  # Statut unique requis pour la protection de `main` et « Wait for CI » de Railway
  ci:
    name: ci
    if: ${{ always() }}
    needs: [quality, e2e, dockerfile]
    runs-on: ubuntu-24.04
    steps:
      - name: Tous les jobs sont verts
        run: |
          test "${{ needs.quality.result }}" = success
          test "${{ needs.e2e.result }}" = success
          test "${{ needs.dockerfile.result }}" = success
